version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ai_radar_db
    environment:
      POSTGRES_DB: ai_radar
      POSTGRES_USER: aidar
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_radar_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ai_radar_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_radar_network

  # AI RADAR API
  api:
    build: .
    container_name: ai_radar_api
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql://aidar:${DB_PASSWORD:-change-me}@db:5432/ai_radar
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      
      # Email
      EMAIL_SMTP_SERVER: ${EMAIL_SMTP_SERVER}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      
      # Slack
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SLACK_CHANNEL: ${SLACK_CHANNEL}
      
      # X/Twitter
      X_API_KEY: ${X_API_KEY}
      X_API_SECRET: ${X_API_SECRET}
      X_ACCESS_TOKEN: ${X_ACCESS_TOKEN}
      X_ACCESS_TOKEN_SECRET: ${X_ACCESS_TOKEN_SECRET}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN}
      
      # Webhooks
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - ai_radar_network
    restart: unless-stopped

  # Scheduled Tasks (Celery Worker)
  worker:
    build: .
    container_name: ai_radar_worker
    command: celery -A app.tasks worker --loglevel=info
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql://aidar:${DB_PASSWORD:-change-me}@db:5432/ai_radar
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      
      # Email
      EMAIL_SMTP_SERVER: ${EMAIL_SMTP_SERVER}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      
      # Slack
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SLACK_CHANNEL: ${SLACK_CHANNEL}
    
    depends_on:
      - db
      - redis
    volumes:
      - ./data:/app/data
    networks:
      - ai_radar_network
    restart: unless-stopped

  # Scheduled Tasks (Celery Beat)
  beat:
    build: .
    container_name: ai_radar_beat
    command: celery -A app.tasks beat --loglevel=info
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql://aidar:${DB_PASSWORD:-change-me}@db:5432/ai_radar
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    
    depends_on:
      - db
      - redis
    volumes:
      - ./data:/app/data
    networks:
      - ai_radar_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ai_radar_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - ai_radar_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  ai_radar_network:
    driver: bridge
